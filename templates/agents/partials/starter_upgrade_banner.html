{% if show_starter_upgrade_cta %}
<div class="pa-upgrade-banner">
    <div class="pa-upgrade-banner__inner">
        <div class="pa-upgrade-banner__content">
            <span class="pa-upgrade-banner__badge">UPGRADE UNLOCKED</span>
            <h4 class="pa-upgrade-banner__title">{{ review_growth.upgrade_title }}</h4>
            <p class="pa-upgrade-banner__message">{{ review_growth.upgrade_message }}</p>
            <div class="pa-upgrade-banner__tags">
                <span>AIO</span>
                <span>GEO</span>
                <span>SEO</span>
                <span>Priority Ranking</span>
            </div>
        </div>
        <div class="pa-upgrade-banner__aside">
            {% if review_upgrade_price %}
            <button type="button"
                    onclick="openProfessionalUpgradeModal()"
                    class="pa-upgrade-banner__btn">
                <span class="pa-upgrade-banner__btn-label">Professional</span>
                <span class="pa-upgrade-banner__btn-price">₹{{ review_upgrade_price.promo_excl_gst|floatformat:0 }}</span>
                {% if review_upgrade_price.show_full_price and review_upgrade_price.full_excl_gst %}
                <span class="pa-upgrade-banner__btn-strike">₹{{ review_upgrade_price.full_excl_gst|floatformat:0 }}</span>
                {% endif %}
                <span class="pa-upgrade-banner__btn-gst">+ GST</span>
            </button>
            {% else %}
            <button type="button"
                    onclick="openProfessionalUpgradeModal()"
                    class="pa-upgrade-banner__btn">
                <span class="pa-upgrade-banner__btn-label">Professional</span>
                <span class="pa-upgrade-banner__btn-price">₹{{ profDisc|floatformat:0 }}</span>
                {% if profFull %}
                <span class="pa-upgrade-banner__btn-strike">₹{{ profFull|floatformat:0 }}</span>
                {% endif %}
            </button>
            {% endif %}
        </div>
    </div>
</div>
{% endif %}
