{% extends 'partials/base.html' %}

{% block extra_css %}
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    .become-a-padosi-agent-con {
        font-family: 'Outfit', sans-serif;
        background: radial-gradient(circle at 10% 20%, rgb(240, 247, 255) 0%, rgb(255, 255, 255) 90%);
        padding: 80px 20px;
        min-height: 100vh;
        display: flex;
        align-items: center;
    }
    .registration-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(226, 232, 240, 0.8);
        border-radius: 24px;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
        padding: 50px;
        max-width: 800px;
        margin: 0 auto;
        transition: transform 0.3s ease;
    }
    .registration-card h2 {
        font-size: 28px;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 8px;
    }
    .registration-card p.subtitle {
        font-size: 15px;
        color: #64748b;
        margin-bottom: 35px;
    }
    .form-group {
        margin-bottom: 24px;
    }
    .form-group label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #334155;
        margin-bottom: 8px;
    }
    .form-control-input, .form-control-select {
        width: 100%;
        padding: 14px 18px;
        border: 1.5px solid #cbd5e1;
        border-radius: 12px;
        font-size: 15px;
        color: #1e293b;
        background: #f8fafc;
        outline: none;
        transition: all 0.3s ease;
    }
    .form-control-input:focus, .form-control-select:focus {
        border-color: #273c8e;
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(39, 60, 142, 0.1);
    }
    .btn-verify {
        background: #273c8e;
        color: #ffffff;
        border: none;
        padding: 0 24px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    .btn-verify:hover {
        background: #1e2e6d;
    }
    .btn-submit {
        background: linear-gradient(135deg, #273c8e 0%, #1e2e6d 100%);
        color: #ffffff;
        border: none;
        padding: 16px 40px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
        box-shadow: 0 10px 20px -5px rgba(39, 60, 142, 0.3);
        transition: all 0.3s ease;
    }
    .btn-submit:hover {
        transform: translateY(-1px);
        box-shadow: 0 15px 25px -5px rgba(39, 60, 142, 0.4);
    }
    .segment-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
    }
    .segment-checkbox {
        position: relative;
    }
    .segment-checkbox input {
        display: none;
    }
    .segment-checkbox label {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px;
        border: 2px solid #e2e8f0;
        border-radius: 14px;
        cursor: pointer;
        font-weight: 600;
        color: #475569;
        background: #f8fafc;
        transition: all 0.3s ease;
        margin-bottom: 0;
    }
    .segment-checkbox label i {
        font-size: 20px;
        color: #94a3b8;
    }
    .segment-checkbox input:checked + label {
        border-color: #273c8e;
        background: #f0f4ff;
        color: #273c8e;
    }
    .segment-checkbox input:checked + label i {
        color: #273c8e;
    }
    .custom-alert {
        display: none;
        border-radius: 12px;
        padding: 12px 16px;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 25px;
        line-height: 1.5;
        border: 1px solid transparent;
    }
    .alert-success-custom {
        align-items: center;
        gap: 8px;
        color: #065f46;
        background: #ecfdf5;
        border-color: #a7f3d0;
    }
    .alert-danger-custom {
        align-items: center;
        gap: 8px;
        color: #991b1b;
        background: #fef2f2;
        border-color: #fca5a5;
    }

    @media (max-width: 768px) {
        .registration-card {
            padding: 30px 20px;
        }
        .segment-grid {
            grid-template-columns: 1fr;
        }
    }
</style>
{% endblock %}

{% block content %}
{% load static %}

<section class="benefit-con become-a-padosi-agent-con position-relative">
    <div class="container">
        <div class="registration-card">

            <div id="successAlert" class="custom-alert alert-success-custom"></div>
            <div id="errorAlert" class="custom-alert alert-danger-custom"></div>

            <form id="agentForm1" action="/agent/register/step1/" method="POST">
                {% csrf_token %}
                <input type="hidden" name="user_types[]" value="insurance_agent">

                <h2>Basic Information</h2>
                <p class="subtitle">Tell us about yourself to setup your account</p>

                <!-- Full Name -->
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" name="fullname" class="form-control-input" placeholder="Enter your full name" required maxlength="70" oninput="this.value = this.value.replace(/[^a-zA-Z\s]/g, '');">
                </div>

                <!-- Email + Mobile -->
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Email Address *</label>
                            <input type="email" name="email" id="regEmail" class="form-control-input" placeholder="your.email@example.com" required onblur="validateEmailOnBlur(this)">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Mobile Number *</label>
                            <input type="tel" name="mobile" class="form-control-input" placeholder="10-digit mobile number" oninput="this.value = this.value.replace(/[^0-9]/g,'')" maxlength="10" pattern="[0-9]{10}" required>
                        </div>
                    </div>
                </div>

                <!-- Pincode -->
                <div class="form-group">
                    <label for="agent_pincode">Service Pincode *</label>
                    <input type="text" id="agent_pincode" name="agent_pincode" class="form-control-input" placeholder="Enter 6-digit pincode" maxlength="6" inputmode="numeric" pattern="[1-9][0-9]{5}" oninput="this.value = this.value.replace(/[^0-9]/g, ''); validateAgentPincode(this);">
                    <div id="pincode-feedback" style="font-size:13px; margin-top:6px; display:none;"></div>
                </div>

                <!-- State -->
                <div class="form-group">
                    <label>State *</label>
                    <select name="state" id="agent_state" class="form-control-select" required>
                        <option value="">Select your state</option>
                        <option value="Andhra Pradesh">Andhra Pradesh</option>
                        <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                        <option value="Assam">Assam</option>
                        <option value="Bihar">Bihar</option>
                        <option value="Chhattisgarh">Chhattisgarh</option>
                        <option value="Goa">Goa</option>
                        <option value="Gujarat">Gujarat</option>
                        <option value="Haryana">Haryana</option>
                        <option value="Himachal Pradesh">Himachal Pradesh</option>
                        <option value="Jharkhand">Jharkhand</option>
                        <option value="Karnataka">Karnataka</option>
                        <option value="Kerala">Kerala</option>
                        <option value="Madhya Pradesh">Madhya Pradesh</option>
                        <option value="Maharashtra">Maharashtra</option>
                        <option value="Manipur">Manipur</option>
                        <option value="Meghalaya">Meghalaya</option>
                        <option value="Mizoram">Mizoram</option>
                        <option value="Nagaland">Nagaland</option>
                        <option value="Odisha">Odisha</option>
                        <option value="Punjab">Punjab</option>
                        <option value="Rajasthan">Rajasthan</option>
                        <option value="Sikkim">Sikkim</option>
                        <option value="Tamil Nadu">Tamil Nadu</option>
                        <option value="Telangana">Telangana</option>
                        <option value="Tripura">Tripura</option>
                        <option value="Uttar Pradesh">Uttar Pradesh</option>
                        <option value="Uttarakhand">Uttarakhand</option>
                        <option value="West Bengal">West Bengal</option>
                        <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
                        <option value="Chandigarh">Chandigarh</option>
                        <option value="Dadra and Nagar Haveli and Daman and Diu">Dadra and Nagar Haveli and Daman and Diu</option>
                        <option value="Delhi">Delhi</option>
                        <option value="Jammu and Kashmir">Jammu and Kashmir</option>
                        <option value="Ladakh">Ladakh</option>
                        <option value="Lakshadweep">Lakshadweep</option>
                        <option value="Puducherry">Puducherry</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <!-- Experience -->
                <div class="form-group">
                    <label>Years of Experience</label>
                    <input name="experience_range" type="number" class="form-control-input" placeholder="e.g. 5" min="0" max="60" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
                </div>

                <!-- Insurance Segments -->
                <div class="form-group">
                    <label>Insurance Segments * <span style="font-weight:400;color:#64748b;">(Select at least one)</span></label>
                    <div class="segment-grid">
                        <div class="segment-checkbox">
                            <input type="checkbox" id="segment_health" name="segments[]" value="health">
                            <label for="segment_health">
                                <i class="fas fa-heartbeat"></i>
                                <span>Health</span>
                            </label>
                        </div>
                        <div class="segment-checkbox">
                            <input type="checkbox" id="segment_life" name="segments[]" value="life">
                            <label for="segment_life">
                                <i class="fas fa-user-shield"></i>
                                <span>Life</span>
                            </label>
                        </div>
                        <div class="segment-checkbox">
                            <input type="checkbox" id="segment_motor" name="segments[]" value="motor">
                            <label for="segment_motor">
                                <i class="fas fa-car"></i>
                                <span>Motor</span>
                            </label>
                        </div>
                        <div class="segment-checkbox">
                            <input type="checkbox" id="segment_sme" name="segments[]" value="sme">
                            <label for="segment_sme">
                                <i class="fas fa-building"></i>
                                <span>SME</span>
                            </label>
                        </div>
                    </div>
                </div>

                <input type="hidden" name="insurance_companies" id="insuranceCompaniesInput" value="[]">

                <!-- Promo Code -->
                <div class="form-group mb-4">
                    <a href="javascript:void(0)" id="togglePromoBtn" style="color: #273C8E; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-size: 15px;">
                        <i class="fas fa-tag"></i> I Have a promo code
                    </a>
                    <div id="promoFieldContainer" style="display: none; margin-top: 15px;">
                        <div class="d-flex gap-2">
                            <input type="text" id="promoCodeInput" class="form-control-input" placeholder="Enter promo code">
                            <button type="button" id="verifyPromoBtn" class="btn-verify" onclick="verifyPromoCode()">Verify</button>
                        </div>
                        <div id="promoMessage" class="mt-2" style="font-weight: 500; font-size: 13px;"></div>
                    </div>
                    <input type="hidden" name="promo_code" id="appliedPromoCode">
                </div>

                <button type="submit" id="mainSubmitBtn" class="btn-submit">Continue to Plans</button>
            </form>
            
            <div class="text-center mt-4 pt-3" style="border-top: 1px solid #e2e8f0;">
                <p style="color: #64748b; font-size: 15px; margin: 0;">Already have an account? <a href="/agent-login" style="color: #0d9488; font-weight: 600; text-decoration: none;">Login here</a></p>
            </div>

        </div>
    </div>
</section>

<script>

        function getCookie(name) {
            let cookieValue = null;

                if (document.cookie && document.cookie !== '') {
                    const cookies = document.cookie.split(';');

                    for (let i = 0; i < cookies.length; i++) {
                        const cookie = cookies[i].trim();

                        if (cookie.substring(0, name.length + 1) === (name + '=')) {
                            cookieValue = decodeURIComponent(
                                cookie.substring(name.length + 1)
                            );
                            break;
                        }
                    }
                }
            return cookieValue;
    }

    const csrftoken = getCookie('csrftoken'); 

    function showAlert(message, type = 'success') {
        const alertDiv = type === 'success'
            ? document.getElementById('successAlert')
            : document.getElementById('errorAlert');
        const otherAlert = type === 'success'
            ? document.getElementById('errorAlert')
            : document.getElementById('successAlert');

        if (!alertDiv) return;
        alertDiv.innerHTML = message;
        alertDiv.style.display = 'flex';
        if (otherAlert) otherAlert.style.display = 'none';
        alertDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function validateEmailOnBlur(input) {
        const email = input.value.trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (email && !emailRegex.test(email)) {
            showAlert('Please enter a valid email address.', 'error');
            input.classList.add('is-invalid');
        } else {
            input.classList.remove('is-invalid');
        }
    }

    function validateAgentPincode(input) {
        const val = input.value.replace(/[^0-9]/g, '');
        const feedback = document.getElementById('pincode-feedback');
        if (val.length === 6) {
            feedback.style.display = 'block';
            feedback.innerHTML = '<span style="color:#273c8e;"><i class="fas fa-spinner fa-spin"></i> Checking location...</span>';
            fetch(`/api/pincode/fetch/${val}`)
                .then(res => res.json())
                .then(res => {
                    if (res.success && res.data && res.data.state) {
                        feedback.innerHTML = `<span style="color:#059669;"><i class="fas fa-check-circle"></i> Service location: ${res.data.office_name || res.data.district}, ${res.data.state}</span>`;
                        document.getElementById('agent_state').value = res.data.state;
                    } else {
                        feedback.innerHTML = '<span style="color:#e67e22;"><i class="fas fa-info-circle"></i> Valid pincode format</span>';
                    }
                })
                .catch(() => {
                    feedback.style.display = 'none';
                });
        } else {
            feedback.style.display = 'none';
        }
    }

    async function verifyPromoCode() {
        const promoCode = document.getElementById('promoCodeInput').value.trim();
        const messageDiv = document.getElementById('promoMessage');
        const verifyBtn = document.getElementById('verifyPromoBtn');

        if (!promoCode) return;
        verifyBtn.disabled = true;

        try {
            const formData = new FormData();
            formData.append('promo_code', promoCode);

            const response = await fetch('/agent/verify-promo/', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': csrftoken
                }
            });

            const data = await response.json();
            if (response.ok && data.success) {
                messageDiv.innerHTML = `<span style="color:#059669;">✓ ${data.message}</span>`;
                document.getElementById('appliedPromoCode').value = promoCode;
            } else {
                messageDiv.innerHTML = `<span style="color:#ef4444;">✗ ${data.message}</span>`;
            }
        } catch {
            messageDiv.innerHTML = '<span style="color:#ef4444;">✗ Error checking promo code.</span>';
        } finally {
            verifyBtn.disabled = false;
        }
    }

    document.getElementById('togglePromoBtn').addEventListener('click', function () {
        document.getElementById('promoFieldContainer').style.display = 'block';
        this.style.display = 'none';
    });

    document.getElementById('agentForm1').addEventListener('submit', async function (e) {
        e.preventDefault();

        const segments = document.querySelectorAll('input[name="segments[]"]:checked');
        if (segments.length === 0) {
            showAlert('Please select at least one insurance segment.', 'error');
            return;
        }

        const formData = new FormData(this);
        const submitBtn = document.getElementById('mainSubmitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Processing...';

        try {
            const response = await fetch(this.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': csrftoken,
                    'Accept': 'application/json'
                }
            });

            const data = await response.json();
            if (response.ok && data.success) {
                window.location.href = data.redirect || '/chooseplan/';
            } else {
                showAlert(data.message || 'Error occurred. Please review inputs.', 'error');
            }
        } catch {
            showAlert('Connection error. Please try again.', 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Continue to Plans';
        }
    });

</script>

</body>
</html>
{% endblock %}
